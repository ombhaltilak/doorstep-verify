<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Portal — Doorstep Verify</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue-dark:  #1A376C;
      --blue-mid:   #255FA8;
      --blue-light: #EEF4FB;
      --green:      #10A050;
      --green-bg:   #E6F4EA;
      --red:        #C03020;
      --red-bg:     #FDECEA;
      --orange:     #E07000;
      --text:       #1E1E2E;
      --gray:       #666;
      --border:     #D0D8E8;
      --white:      #FFFFFF;
      --radius:     10px;
      --shadow:     0 2px 12px rgba(0,0,0,0.08);
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--blue-light);
      color: var(--text);
      min-height: 100vh;
    }

    /* ── Header ── */
    .header {
      background: var(--blue-dark);
      color: white;
      padding: 16px 24px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .header-icon { font-size: 28px; }
    .header h1  { font-size: 20px; font-weight: 700; }
    .header p   { font-size: 12px; opacity: 0.7; }

    /* ── Layout ── */
    .layout {
      display: grid;
      grid-template-columns: 400px 1fr;
      gap: 24px;
      padding: 24px;
      max-width: 1200px;
      margin: 0 auto;
    }
    @media (max-width: 768px) {
      .layout { grid-template-columns: 1fr; }
    }

    /* ── Panel ── */
    .panel {
      background: var(--white);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow: hidden;
    }
    .panel-header {
      background: var(--blue-mid);
      color: white;
      padding: 14px 20px;
      font-weight: 700;
      font-size: 15px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-body { padding: 20px; display: flex; flex-direction: column; gap: 14px; }

    /* ── Form fields ── */
    .field { display: flex; flex-direction: column; gap: 5px; }
    .field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: var(--gray);
    }
    input[type="text"] {
      border: 2px solid var(--border);
      border-radius: 8px;
      padding: 10px 12px;
      font-size: 14px;
      width: 100%;
      background: var(--white);
      color: var(--text);
      outline: none;
      transition: border-color 0.15s;
    }
    input[type="text"]:focus { border-color: var(--blue-mid); }
    input[readonly] { background: #f5f7fa; cursor: default; }

    .gps-row { display: flex; gap: 8px; }
    .gps-row input { flex: 1; }

    .btn-gps {
      background: var(--blue-mid);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0 14px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      flex-shrink: 0;
    }
    .btn-gps:disabled { opacity: 0.5; cursor: not-allowed; }

    .coords-row { display: flex; gap: 8px; }
    .coords-row input { flex: 1; }

    /* ── Buttons ── */
    .btn-primary {
      background: var(--blue-mid);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 12px 20px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      width: 100%;
      transition: opacity 0.15s;
    }
    .btn-primary:hover   { opacity: 0.9; }
    .btn-primary:disabled { opacity: 0.45; cursor: not-allowed; }

    .btn-sm {
      background: var(--blue-light);
      color: var(--blue-mid);
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 5px 12px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
    }
    .btn-danger-sm {
      background: var(--red-bg);
      color: var(--red);
      border: 1px solid var(--red);
      border-radius: 6px;
      padding: 4px 10px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
    }

    /* ── Status messages ── */
    .gps-status {
      font-size: 12px;
      padding: 6px 10px;
      border-radius: 6px;
      display: none;
    }
    .gps-status.loading { background: #FFF8E1; color: #8B6914; display: block; }
    .gps-status.success { background: var(--green-bg); color: var(--green); display: block; }
    .gps-status.warn    { background: var(--red-bg); color: var(--red); display: block; }

    .result-box {
      border-radius: 8px;
      padding: 12px 16px;
      font-size: 13px;
      line-height: 1.6;
      display: none;
    }
    .result-box.success { background: var(--green-bg); color: var(--green); display: block; }
    .result-box.fail    { background: var(--red-bg); color: var(--red); display: block; }

    /* ── Delivery table ── */
    .toolbar {
      display: flex;
      gap: 8px;
      padding: 14px 20px;
      border-bottom: 1px solid var(--border);
      align-items: center;
      flex-wrap: wrap;
    }
    .toolbar input {
      flex: 1;
      min-width: 120px;
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      outline: none;
    }
    .toolbar input:focus { border-color: var(--blue-mid); }
    select {
      border: 2px solid var(--border);
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 13px;
      background: white;
      cursor: pointer;
      outline: none;
    }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      background: var(--blue-light);
      color: var(--blue-dark);
      font-weight: 700;
      padding: 10px 12px;
      text-align: left;
      border-bottom: 2px solid var(--border);
      white-space: nowrap;
    }
    td {
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
      vertical-align: middle;
    }
    tr:hover td { background: #f8fafd; }

    .badge {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-pending   { background: #FFF3CD; color: #856404; }
    .badge-completed { background: var(--green-bg); color: var(--green); }
    .badge-verified  { background: #D1FAE5; color: #065F46; }
    .badge-failed    { background: var(--red-bg); color: var(--red); }

    .loading-row td { text-align: center; color: var(--gray); padding: 32px; }
    .hint { font-size: 12px; color: var(--gray); }
  </style>
</head>
<body>

<div class="header">
  <div class="header-icon">🏢</div>
  <div>
    <h1>Dispatch Portal</h1>
    <p>Doorstep Verify — Company Admin</p>
  </div>
</div>

<div class="layout">

  <!-- ── Add Parcel Panel ───────────────────────────────── -->
  <div class="panel">
    <div class="panel-header">📦 Add New Parcel</div>
    <div class="panel-body">

      <div class="field">
        <label>Tracking ID *</label>
        <input id="f-tracking" type="text" placeholder="e.g. PKG20260001"
               oninput="this.value = this.value.toUpperCase()" style="text-transform:uppercase">
      </div>

      <div class="field">
        <label>Customer Name *</label>
        <input id="f-customer" type="text" placeholder="e.g. James Carter">
      </div>

      <div class="field">
        <label>Delivery Address *</label>
        <div class="gps-row">
          <input id="f-address" type="text" placeholder="e.g. 847 Oak Street, Chicago, IL 60601">
          <button class="btn-gps" id="btn-gps" onclick="fillFromGPS()">📍 GPS</button>
        </div>
        <div id="gps-status" class="gps-status"></div>
        <p class="hint" style="margin-top:4px">Click 📍 GPS to auto-fill address from your current location</p>
      </div>

      <div class="field">
        <label>Expected GPS Coordinates (auto-filled)</label>
        <div class="coords-row">
          <input id="f-lat" type="text" placeholder="Latitude"  readonly>
          <input id="f-lng" type="text" placeholder="Longitude" readonly>
        </div>
      </div>

      <div class="field">
        <label>what3words (auto-filled from GPS)</label>
        <input id="f-w3w" type="text" placeholder="e.g. fills.rigid.bunch">
      </div>

      <div class="field">
        <label>Assign to Driver *</label>
        <input id="f-driver" type="text" placeholder="e.g. driver01"
               oninput="this.value = this.value.toLowerCase()">
      </div>

      <button class="btn-primary" id="btn-submit" onclick="submitParcel()">
        ✅ Add Parcel
      </button>
      <div id="submit-result" class="result-box"></div>

    </div>
  </div>

  <!-- ── Deliveries Panel ───────────────────────────────── -->
  <div class="panel">
    <div class="panel-header">📋 All Deliveries</div>
    <div class="toolbar">
      <input id="filter-search" type="text" placeholder="Search tracking / customer / driver…"
             oninput="renderTable()">
      <select id="filter-status" onchange="renderTable()">
        <option value="">All Status</option>
        <option value="pending">Pending</option>
        <option value="completed">Completed</option>
      </select>
      <button class="btn-sm" onclick="loadDeliveries()">↻ Refresh</button>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Tracking ID</th>
            <th>Customer</th>
            <th>Driver</th>
            <th>Address</th>
            <th>Status</th>
            <th>Verified</th>
            <th>GPS</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody id="deliveries-tbody">
          <tr class="loading-row"><td colspan="8">Loading deliveries…</td></tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<script>
  const API_URL = 'https://doorstep-verify-api.onrender.com';
  const W3W_KEY = 'SGU2U9NM';
  let allDeliveries = [];

  // ── Load deliveries ──────────────────────────────────────────────────────
  async function loadDeliveries() {
    const tbody = document.getElementById('deliveries-tbody');
    tbody.innerHTML = '<tr class="loading-row"><td colspan="8">Loading…</td></tr>';
    try {
      const r = await fetch(`${API_URL}/deliveries`);
      allDeliveries = await r.json();
      renderTable();
    } catch (e) {
      tbody.innerHTML = `<tr class="loading-row"><td colspan="8">Error: ${e.message}</td></tr>`;
    }
  }

  function renderTable() {
    const search = document.getElementById('filter-search').value.toLowerCase();
    const status = document.getElementById('filter-status').value;
    const tbody  = document.getElementById('deliveries-tbody');

    let rows = allDeliveries.filter(d => {
      const matchSearch = !search || [d.tracking_id, d.customer_name, d.driver_id, d.address]
        .some(v => (v||'').toLowerCase().includes(search));
      const matchStatus = !status || d.status === status;
      return matchSearch && matchStatus;
    });

    if (!rows.length) {
      tbody.innerHTML = '<tr class="loading-row"><td colspan="8">No deliveries found.</td></tr>';
      return;
    }

    tbody.innerHTML = rows.map(d => {
      const statusBadge = d.status === 'completed'
        ? (d.verified ? '<span class="badge badge-verified">✅ Verified</span>' : '<span class="badge badge-failed">❌ Failed</span>')
        : '<span class="badge badge-pending">⏳ Pending</span>';

      const gps = d.expected_lat
        ? `<span style="color:var(--green);font-size:11px">✓ ${d.expected_lat.toFixed(4)}, ${d.expected_lng.toFixed(4)}</span>`
        : '<span style="color:var(--gray);font-size:11px">—</span>';

      return `<tr>
        <td><strong>${d.tracking_id}</strong></td>
        <td>${d.customer_name || '—'}</td>
        <td>${d.driver_id || '—'}</td>
        <td style="max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${d.address||''}">${d.address || '—'}</td>
        <td>${statusBadge}</td>
        <td>${d.verified === true ? '✅' : d.verified === false ? '❌' : '—'}</td>
        <td>${gps}</td>
        <td>
          <button class="btn-danger-sm" onclick="resetDelivery('${d.tracking_id}')">Reset</button>
        </td>
      </tr>`;
    }).join('');
  }

  // ── Reset delivery to pending ────────────────────────────────────────────
  async function resetDelivery(trackingId) {
    if (!confirm(`Reset ${trackingId} back to pending?`)) return;
    try {
      const r = await fetch(`${API_URL}/deliveries/${trackingId}/reset`, { method: 'POST' });
      if (r.ok) { loadDeliveries(); }
      else { alert('Reset failed: ' + await r.text()); }
    } catch (e) { alert('Error: ' + e.message); }
  }

  // ── GPS auto-fill ────────────────────────────────────────────────────────
  async function fillFromGPS() {
    const btn    = document.getElementById('btn-gps');
    const status = document.getElementById('gps-status');

    btn.disabled = true;
    btn.textContent = '⏳';
    status.className = 'gps-status loading';
    status.textContent = 'Getting GPS location…';

    navigator.geolocation.getCurrentPosition(
      async (pos) => {
        const lat = pos.coords.latitude;
        const lng = pos.coords.longitude;
        const acc = Math.round(pos.coords.accuracy);

        document.getElementById('f-lat').value = lat.toFixed(7);
        document.getElementById('f-lng').value = lng.toFixed(7);
        status.textContent = `GPS locked ±${acc}m — fetching address…`;

        // Reverse geocode
        try {
          const r = await fetch(
            `https://nominatim.openstreetmap.org/reverse?lat=${lat}&lon=${lng}&format=json`,
            { headers: { 'User-Agent': 'DoorstepVerify/1.0 kalpandeparimal60@gmail.com' } }
          );
          const d = await r.json();
          if (d.address) {
            const a = d.address;
            const parts = [
              a.house_number, a.road || a.pedestrian || a.footway,
              a.suburb || a.neighbourhood, a.city || a.town || a.village, a.state,
            ].filter(Boolean);
            document.getElementById('f-address').value = parts.join(', ') || d.display_name;
          }
          status.className = 'gps-status success';
          status.textContent = `Address filled from GPS (±${acc}m)`;
        } catch (e) {
          status.className = 'gps-status warn';
          status.textContent = 'Geocoding failed — enter address manually';
        }

        // W3W
        if (W3W_KEY) {
          try {
            const wr = await fetch(
              `https://api.what3words.com/v3/convert-to-3wa?coordinates=${lat},${lng}&language=en&key=${W3W_KEY}`
            );
            const wd = await wr.json();
            if (wd.words) document.getElementById('f-w3w').value = wd.words;
          } catch (e) {}
        }

        btn.disabled = false;
        btn.textContent = '📍 GPS';
      },
      (err) => {
        status.className = 'gps-status warn';
        status.textContent = `GPS error: ${err.message}`;
        btn.disabled = false;
        btn.textContent = '📍 GPS';
      },
      { enableHighAccuracy: true, timeout: 20000, maximumAge: 0 }
    );
  }

  // ── Submit parcel ────────────────────────────────────────────────────────
  async function submitParcel() {
    const tracking  = document.getElementById('f-tracking').value.trim().toUpperCase();
    const customer  = document.getElementById('f-customer').value.trim();
    const address   = document.getElementById('f-address').value.trim();
    const driver    = document.getElementById('f-driver').value.trim().toLowerCase();
    const latVal    = document.getElementById('f-lat').value.trim();
    const lngVal    = document.getElementById('f-lng').value.trim();
    const w3w       = document.getElementById('f-w3w').value.trim();
    const resultEl  = document.getElementById('submit-result');

    if (!tracking) { alert('Tracking ID is required'); return; }
    if (!customer) { alert('Customer Name is required'); return; }
    if (!address)  { alert('Address is required'); return; }
    if (!driver)   { alert('Driver ID is required'); return; }

    const payload = { tracking_id: tracking, customer_name: customer, address, driver_id: driver };
    if (latVal && lngVal) {
      payload.expected_lat = parseFloat(latVal);
      payload.expected_lng = parseFloat(lngVal);
    }
    if (w3w) payload.front_door_w3w = w3w;

    const btn = document.getElementById('btn-submit');
    btn.disabled = true;
    btn.textContent = 'Saving…';

    try {
      const r = await fetch(`${API_URL}/deliveries`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify(payload),
      });
      const d = await r.json();
      if (r.ok && d.ok) {
        resultEl.className = 'result-box success';
        resultEl.innerHTML = `✅ <strong>Saved!</strong> Tracking ID: <code style="font-family:monospace">${d.tracking_id}</code>`;
        // Clear form
        ['f-tracking','f-customer','f-address','f-lat','f-lng','f-w3w','f-driver'].forEach(id => {
          document.getElementById(id).value = '';
        });
        document.getElementById('gps-status').className = 'gps-status';
        loadDeliveries();
        setTimeout(() => { resultEl.className = 'result-box'; }, 3000);
      } else {
        throw new Error(d.detail || d.error || 'Unknown error');
      }
    } catch (e) {
      resultEl.className = 'result-box fail';
      resultEl.innerHTML = `❌ <strong>Error:</strong> ${e.message}`;
    }

    btn.disabled = false;
    btn.textContent = '✅ Add Parcel';
  }

  // Load on start
  loadDeliveries();
</script>
</body>
</html>
